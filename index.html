<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Investment Governance Scorecard · Delta Investment Partners</title>
<meta name="description" content="A seven-dimension diagnostic of investment governance maturity, benchmarked against institutional-grade practice." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1A3A52; --teal:#15706B; --copper:#B08D57;
    --offwhite:#F5F3EF; --white:#FFFFFF;
    --ink:#1A3A52; --body:#41505b; --muted:#7c8791;
    --line:#e4ddd2; --line-strong:#d3cabb;
    --band-foundational:#9aa7ae;
    --band-developing:#6fa9a2;
    --band-robust:#15706B;
    --band-institutional:#B08D57;
    --serif:"PT Serif",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --maxw:760px;
    --ease:cubic-bezier(.4,.0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans); color:var(--body); background:var(--offwhite);
    line-height:1.6; font-size:17px; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}
  h1,h2,h3{font-family:var(--serif); color:var(--ink); font-weight:700; line-height:1.2}
  .eyebrow{
    font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--teal);
  }
  .eyebrow.on-navy{color:var(--copper)}
  a{color:var(--teal)}

  /* ---------- top bar ---------- */
  .topbar{border-bottom:1px solid var(--line); background:var(--offwhite)}
  .topbar .wrap{display:flex; align-items:center; gap:12px; height:64px}
  .mark{width:20px;height:18px;display:inline-block}
  .brand{font-family:var(--serif); font-weight:700; color:var(--ink); font-size:16px; letter-spacing:.01em}
  .brand span{color:var(--muted); font-family:var(--sans); font-weight:500; font-size:13px; letter-spacing:.02em}

  /* ---------- progress ---------- */
  .progress{padding-top:28px}
  .progress-meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .progress-meta .step{font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--muted); text-transform:uppercase}
  .progress-track{height:2px; background:var(--line-strong); border-radius:2px; overflow:hidden}
  .progress-fill{height:100%; background:var(--teal); width:0; transition:width .5s var(--ease)}

  /* ---------- panels ---------- */
  .screen{padding:44px 0 72px; animation:rise .45s var(--ease) both}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    .progress-fill{transition:none}
  }

  /* ---------- hero (intro) ---------- */
  .hero{background:var(--navy); color:#dfe7ec}
  .hero .wrap{padding-top:72px; padding-bottom:76px}
  .hero h1{color:var(--white); font-size:38px; margin:18px 0 18px; max-width:16ch}
  .hero p.lede{font-size:18px; color:#c3d0d9; max-width:52ch; margin-bottom:32px}
  .facts{display:flex; gap:28px; flex-wrap:wrap; margin-bottom:38px; border-top:1px solid rgba(255,255,255,.14); padding-top:24px}
  .fact{min-width:120px}
  .fact .n{font-family:var(--serif); font-size:26px; color:var(--copper); line-height:1}
  .fact .l{font-size:13px; color:#9fb1bd; margin-top:6px}
  .hero .note{font-size:13.5px; color:#8fa0ac; margin-top:18px; max-width:50ch}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--sans); font-size:15px; font-weight:600; letter-spacing:.01em;
    border:none; border-radius:2px; padding:14px 26px; cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease), border-color .2s;
    display:inline-flex; align-items:center; gap:10px;
  }
  .btn-primary{background:var(--teal); color:#fff}
  .btn-primary:hover{background:#0f5b57}
  .btn-primary:disabled{background:#b7c3c1; cursor:not-allowed}
  .btn-ghost{background:transparent; color:var(--body); padding:14px 8px}
  .btn-ghost:hover{color:var(--ink)}
  .btn-on-navy{background:var(--copper); color:#241a0e}
  .btn-on-navy:hover{background:#c69c62}
  .btn .arrow{font-size:17px; line-height:1}

  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:38px}

  /* ---------- questions ---------- */
  .dim-title{font-size:29px; margin:10px 0 6px}
  .dim-sub{color:var(--muted); font-size:15px; margin-bottom:34px}
  .qblock{margin-bottom:38px}
  .qprompt{font-family:var(--serif); font-size:19px; color:var(--ink); font-weight:700; margin-bottom:16px; line-height:1.35}
  .options{display:flex; flex-direction:column; gap:10px}
  .opt{position:relative}
  .opt input{position:absolute; opacity:0; width:1px; height:1px}
  .opt label{
    display:block; cursor:pointer; background:var(--white);
    border:1px solid var(--line-strong); border-left:3px solid var(--line-strong);
    border-radius:2px; padding:14px 18px 15px; transition:border-color .18s var(--ease), background .18s, box-shadow .18s;
  }
  .opt label:hover{border-color:var(--teal); border-left-color:var(--teal)}
  .opt .band-tag{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px}
  .opt .band-desc{font-size:15px; color:var(--body); line-height:1.5}
  .opt input:checked + label{border-color:var(--teal); border-left-color:var(--teal); border-left-width:3px; background:#fbfaf7; box-shadow:0 1px 0 rgba(21,112,107,.08)}
  .opt input:checked + label .band-tag{color:var(--teal)}
  .opt input:focus-visible + label{outline:2px solid var(--navy); outline-offset:2px}

  /* ---------- result ---------- */
  .result-band{font-size:40px; margin:8px 0 6px}
  .result-line{font-size:18px; color:var(--body); max-width:48ch; margin-bottom:8px}
  .radar-holder{display:flex; justify-content:center; margin:22px 0 8px}
  .radar-legend{display:flex; gap:20px; justify-content:center; font-size:12.5px; color:var(--muted); margin-bottom:10px; flex-wrap:wrap}
  .radar-legend .k{display:inline-flex; align-items:center; gap:7px}
  .swatch{width:11px;height:11px;border-radius:2px;display:inline-block}

  /* ---------- gate ---------- */
  .gate{background:var(--white); border:1px solid var(--line-strong); border-radius:3px; padding:30px 28px; margin-top:26px}
  .gate h3{font-size:20px; margin-bottom:6px}
  .gate .gate-sub{font-size:14.5px; color:var(--muted); margin-bottom:22px; max-width:46ch}
  .field{margin-bottom:16px}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; letter-spacing:.01em}
  .field input,.field select{
    width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
    padding:11px 13px; border:1px solid var(--line-strong); border-radius:2px; background:#fdfcfa;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .consent{display:flex; gap:11px; align-items:flex-start; margin:6px 0 20px; font-size:13px; color:var(--body); line-height:1.5}
  .consent input{margin-top:3px; flex:none; width:16px; height:16px; accent-color:var(--teal)}
  .cf-turnstile{margin-bottom:18px}
  .gate-error{color:#9d3b2f; font-size:13.5px; margin-bottom:14px; display:none}

  /* ---------- detail ---------- */
  .detail-intro{font-size:18px; color:var(--body); max-width:52ch; margin-bottom:34px; padding-bottom:28px; border-bottom:1px solid var(--line)}
  .dimrow{padding:20px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:8px 20px; align-items:start}
  .dimrow .dname{font-family:var(--serif); font-weight:700; color:var(--ink); font-size:17px}
  .dimrow .dguide{grid-column:1/2; font-size:14.5px; color:var(--body); margin-top:6px; line-height:1.55}
  .chip{font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#fff; padding:4px 10px; border-radius:2px; white-space:nowrap; align-self:start}
  .priority{background:#fbf7f0; border:1px solid var(--line-strong); border-left:3px solid var(--copper); border-radius:2px; padding:22px 24px; margin:34px 0}
  .priority h3{font-size:18px; margin-bottom:6px}
  .priority p.pl{font-size:14.5px; color:var(--body); margin-bottom:14px}
  .priority ul{list-style:none}
  .priority li{padding:7px 0; border-top:1px solid var(--line); font-size:15px; color:var(--ink); display:flex; justify-content:space-between; gap:14px}
  .priority li:first-child{border-top:none}
  .cta{background:var(--navy); color:#dbe4ea; border-radius:3px; padding:34px 30px; margin-top:36px}
  .cta .eyebrow{color:var(--copper)}
  .cta h3{color:#fff; font-size:24px; margin:12px 0 10px}
  .cta p{font-size:15.5px; color:#c1cfd8; max-width:50ch; margin-bottom:22px}
  .helps{font-size:15.5px; color:var(--body); max-width:52ch; margin:30px 0 6px}

  .footer{border-top:1px solid var(--line); padding:26px 0 40px; font-size:12.5px; color:var(--muted)}
  .footer .wrap{display:flex; flex-direction:column; gap:6px}

  @media (max-width:560px){
    body{font-size:16px}
    .hero h1{font-size:30px}
    .result-band{font-size:32px}
    .grid2{grid-template-columns:1fr}
    .dim-title{font-size:24px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 40 36" aria-hidden="true">
      <path d="M20 2 L38 34 L2 34 Z" fill="none" stroke="#1A3A52" stroke-width="2.5"/>
      <path d="M24 12 L38 34 L10 34 Z" fill="#B08D57" opacity="0.9"/>
    </svg>
    <div class="brand">Delta Investment Partners <span>· Governance Scorecard</span></div>
  </div>
</div>

<div id="app"></div>

<div class="footer">
  <div class="wrap">
    <div>Delta Investment Partners — Institutional rigour. Boutique service.</div>
    <div>This scorecard is a self-assessment and provides general information only, not personal advice. For wholesale clients.</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — wired up in Phase 6 (hosting). Safe defaults let the page
   run and be tested standalone before the function/Turnstile exist.
   ===================================================================== */
const CONFIG = {
  SUBMIT_URL: "/api/submit",        // Cloudflare Pages Function (Phase 5)
  CONFIG_URL: "/api/config",        // optional: live scoring weights (Phase 5)
  TURNSTILE_SITE_KEY: "",           // set in Phase 6; empty = skip bot-check (preview mode)
  START_CONVERSATION_URL: "https://deltaip.com.au/contact"
};

/* Default scoring config — mirrors the seeded scoring_config row.
   If CONFIG_URL returns live values they override these, so editing
   weights in Supabase keeps the on-screen headline in sync. */
let SCORING = {
  band_points:{foundational:0, developing:33.33, robust:66.67, institutional_grade:100},
  dimension_weights:{d1:1,d2:1,d3:1,d4:1,d5:1,d6:1,d7:1},
  band_thresholds:{developing:26, robust:51, institutional_grade:81}
};

const BAND_ORDER=["foundational","developing","robust","institutional_grade"];
const BAND_LABEL={foundational:"Foundational",developing:"Developing",robust:"Robust",institutional_grade:"Institutional-grade"};
const BAND_COLOR={foundational:"var(--band-foundational)",developing:"var(--band-developing)",robust:"var(--band-robust)",institutional_grade:"var(--band-institutional)"};

/* =====================================================================
   INSTRUMENT — 7 dimensions, 13 probes
   ===================================================================== */
const DIMENSIONS=[
 {id:"d1", n:1, title:"Governance foundations & investment beliefs",
  probes:[
   {id:"d1a", prompt:"Which best describes your organisation's investment beliefs?",
    options:{foundational:"No written beliefs; the philosophy is implicit and lives in the heads of one or two decision-makers.",
     developing:"Some investment principles appear in a policy or mandate, but there's no distinct, articulated beliefs statement.",
     robust:"A documented beliefs statement exists, though it's revisited only occasionally and rarely referenced in decisions.",
     institutional_grade:"A board-endorsed beliefs statement is documented, reviewed on a set cycle, and explicitly referenced when decisions are framed and evaluated."}},
   {id:"d1b", prompt:"Which best describes your investment governance charter (or terms of reference)?",
    options:{foundational:"No charter or terms of reference; who decides what is understood informally.",
     developing:"Roles and mandate are partly documented, but there's no consolidated governance charter.",
     robust:"A charter or terms of reference exists setting out mandate, roles and decision scope, though reviewed infrequently.",
     institutional_grade:"A board-endorsed charter defines mandate, roles and review obligations, and is kept current on a set cycle."}}
  ]},
 {id:"d2", n:2, title:"Investment Committee composition & independence",
  probes:[
   {id:"d2a", prompt:"Which best describes your Investment Committee?",
    options:{foundational:"There's no standing IC; decisions are effectively made by one or two individuals.",
     developing:"An IC exists, but membership, required skills or quorum aren't clearly defined, and it meets irregularly.",
     robust:"A properly constituted IC with defined membership, a relevant skills mix and quorum, meeting on a regular cycle.",
     institutional_grade:"A constituted IC with a deliberately designed skills mix, defined quorum and cadence, and documented succession so it doesn't depend on any one person."}},
   {id:"d2b", prompt:"How much genuine independent challenge sits on your Investment Committee?",
    options:{foundational:"The people who make the recommendations are the same people who approve them; no independent voice.",
     developing:"Some internal cross-checking, but no independent or external member and limited genuine challenge.",
     robust:"The IC includes at least one member independent of the recommending function, who does challenge decisions.",
     institutional_grade:"Independent or external challenge is built in by design — members with the standing and mandate to dissent, structurally separate from the recommending function."}}
  ]},
 {id:"d3", n:3, title:"Decision rights & delegation",
  probes:[
   {id:"d3a", prompt:"How are investment decision rights and delegations defined?",
    options:{foundational:"Not documented; who can decide what is understood informally.",
     developing:"Broadly understood and partly documented, but with gaps or ambiguity at the edges.",
     robust:"A documented framework sets out what the IC decides versus what's delegated, and it's applied consistently.",
     institutional_grade:"The framework specifies decision rights and delegated authorities precisely, is board-approved, and is reviewed on a set cycle."}},
   {id:"d3b", prompt:"What happens when someone acts outside their delegated authority?",
    options:{foundational:"There are no explicit limits, so there's nothing to breach.",
     developing:"Limits exist in principle but aren't well-defined, and a breach would likely go unnoticed.",
     robust:"Delegated authorities carry explicit limits, and a breach would be caught and raised.",
     institutional_grade:"Explicit limits, active monitoring for breaches, a defined escalation path, and breaches are logged and reviewed."}}
  ]},
 {id:"d4", n:4, title:"Pre-decision documentation & rigour",
  probes:[
   {id:"d4a", prompt:"Before a material investment decision, what documentation exists?",
    options:{foundational:"Little or none; the rationale is verbal, and any write-up comes after the fact.",
     developing:"A short paper or email for the biggest decisions only, focused on the recommendation rather than alternatives.",
     robust:"A standard decision paper with rationale is prepared for most material decisions before they're made.",
     institutional_grade:"A standard paper covering options, analysis, risks and rationale is on file before every material decision, and forms the basis of the IC's discussion."}},
   {id:"d4b", prompt:"How rigorous is your manager selection and due diligence?",
    options:{foundational:"Managers are chosen largely on relationships, reputation or past performance, with little documented analysis.",
     developing:"We do some research and write up a rationale, but coverage is uneven; operational DD and fee benchmarking are often light.",
     robust:"Selection follows a documented process covering investment and operational due diligence, with a written rationale on file.",
     institutional_grade:"A consistent, documented process covers investment and operational DD and fee benchmarking, with a clear evidentiary trail behind every appointment."}}
  ]},
 {id:"d5", n:5, title:"Challenge & dissent protocols",
  probes:[
   {id:"d5a", prompt:"How is genuine challenge built into your decision-making?",
    options:{foundational:"We rely on open discussion; there's no deliberate mechanism to surface counter-arguments.",
     developing:"Challenge happens when someone chooses to speak up, but it isn't structured or expected.",
     robust:"We use some structured challenge for major decisions — a designated challenger, a pre-mortem, or a required case against.",
     institutional_grade:"Structured challenge is standard: every material decision is deliberately stress-tested before it's made."}},
   {id:"d5b", prompt:"What happens to dissenting views on your Investment Committee?",
    options:{foundational:"Dissent rarely surfaces; decisions are presented as consensus and disagreement isn't recorded.",
     developing:"Disagreement is heard in the room but not documented, and challenging a senior view carries some social cost.",
     robust:"Dissent is usually captured in the minutes, and members are generally free to challenge regardless of seniority.",
     institutional_grade:"Dissent is recorded as a matter of course, revisited when relevant, and challenging the most senior view is expected and cost-free."}}
  ]},
 {id:"d6", n:6, title:"Conflicts & independence of advice",
  probes:[
   {id:"d6a", prompt:"How are conflicts of interest in investment decisions handled?",
    options:{foundational:"Conflicts aren't formally identified or documented.",
     developing:"Conflicts are recognised informally when they arise, but there's no register or defined process.",
     robust:"A conflicts register exists and is reviewed, and material conflicts are disclosed and managed.",
     institutional_grade:"Conflicts are systematically identified, registered, disclosed and actively managed, with each decision demonstrably in the client's interest and on record."}},
   {id:"d6b", prompt:"How independent is your investment advice from product and distribution incentives?",
    options:{foundational:"Selection is materially influenced by in-house products, related parties, or revenue-sharing arrangements.",
     developing:"Mostly independent, but some product, platform or remuneration incentives sit in the background and aren't fully addressed.",
     robust:"Advice is largely free of product and distribution incentives, with the main conflicts identified and mitigated.",
     institutional_grade:"Advice is structurally independent — no proprietary-product bias, no conflicted remuneration, and the independence is demonstrable and evidenced."}}
  ]},
 {id:"d7", n:7, title:"Monitoring & post-decision accountability",
  probes:[
   {id:"d7a", prompt:"How are decisions and managers monitored after they're made?",
    options:{foundational:"We review performance periodically, but there's little structured monitoring against the original thesis.",
     developing:"We monitor performance and managers, but on an ad hoc basis without defined triggers.",
     robust:"Monitoring runs on a defined cadence, with watch-list and termination triggers for managers and positions.",
     institutional_grade:"Decisions and managers are monitored against their original thesis on a set cadence, with explicit triggers, feeding back into the next decision."}},
   {id:"d7b", prompt:"What happens when a decision doesn't work out as expected?",
    options:{foundational:"Outcomes aren't formally attributed; we move on without a structured review.",
     developing:"We notice when something underperforms, but there's no consistent process to review why or capture the lesson.",
     robust:"Material decisions are reviewed against their thesis, and clear lessons are discussed by the IC.",
     institutional_grade:"Outcomes are attributed to decisions, mistakes reviewed without blame, lessons recorded, and resulting actions tracked to completion."}}
  ]}
];

/* =====================================================================
   RESULT COPY
   ===================================================================== */
const HEADLINE={
 foundational:"Your governance rests largely on trust and individual judgement rather than documented process.",
 developing:"The building blocks are in place, but applied unevenly — not yet the backbone of how decisions get made.",
 robust:"A genuine governance framework is operating; the remaining gaps are specific rather than structural.",
 institutional_grade:"Your governance operates at the standard of the best-run institutional investors."
};
const INTERPRET={
 foundational:"Your investment governance is still largely informal: decisions rest on the judgement and goodwill of a few people rather than documented process. That can work while the team is small and stable, but it leaves you exposed if a key person leaves, a decision is challenged, or a client or regulator asks how a decision was reached. The distance to institutional practice is wide — but it's also the most improvable, since a handful of foundational documents and structures move the needle quickly.",
 developing:"You have many of the building blocks of good governance, but they're applied unevenly: documentation for some decisions and not others, challenge when someone speaks up rather than by design, gaps in independence or monitoring. This is where a great many capable boutiques sit — competent people getting good outcomes on a framework that wouldn't fully withstand scrutiny. The path forward is mostly consistency: making the pieces you already have standard practice.",
 robust:"A real governance framework is operating: decisions are documented, there's genuine challenge, and monitoring is disciplined. What separates you from institutional-grade is usually not structure but consistency and independence — documents that are current and actually drive decisions rather than sitting in a drawer, and challenge that's independent by design rather than by goodwill. The remaining gaps tend to be specific and addressable.",
 institutional_grade:"Your governance operates at the level of the best-run institutional investors: documented, independently challenged, conflict-managed, and accountable for outcomes. Few organisations reach this bar across every dimension, and holding it is its own discipline as the business grows and people change. The value now is in stress-testing that the framework holds under pressure and doesn't quietly erode."
};
const GUIDE={
 d1:"Institutional-grade organisations write down what they believe about investing and how they'll govern it — a board-endorsed beliefs statement and governance charter — and, crucially, they use them: reviewed on a cycle, genuinely anchoring how decisions are framed and judged.",
 d2:"At the top standard the Investment Committee is deliberately constructed — a defined skills mix, quorum and succession — and contains genuine independent challenge: someone structurally separate from those making the recommendation, with the standing and mandate to disagree.",
 d3:"Institutional-grade governance sets out precisely who can decide what, with delegated authorities carrying explicit limits that have teeth — breaches monitored for, escalated through a defined path, and logged. A live control, not a diagram.",
 d4:"The best organisations document the case for a decision before they make it — options, analysis, risks and rationale — and hold manager appointments to the same bar: investment and operational due diligence and fee benchmarking, with a clear evidentiary trail.",
 d5:"At institutional standard, challenge is engineered in: material decisions deliberately stress-tested, and dissent recorded and revisited, with challenging the most senior view treated as a duty rather than a discourtesy. This is where decisions are protected from groupthink.",
 d6:"The top standard is both process and structure: conflicts systematically identified, registered and actively managed; and advice structurally independent of product and distribution incentives — independence you can evidence, not just assert.",
 d7:"Institutional-grade organisations close the loop: decisions and managers monitored against the original thesis, and when something doesn't work out the outcome is attributed, reviewed without blame, and the lesson captured and acted on. Accountability, not just reporting."
};
const ORG_TYPES=[
 ["","Select…"],["asset_owner","Asset owner / institution"],["licensee","AFSL holder / licensee"],
 ["advice_practice","Advice practice"],["platform_operator","Platform / managed-account operator"],["other","Other"]
];

/* =====================================================================
   STATE + SCORING
   ===================================================================== */
const answers={};                 // probeId -> band
let stepIndex=0;                   // 0=intro, 1..7=dimensions, 8=result
let resultPhase="free";           // free | detail
const app=document.getElementById("app");

function pts(band){return SCORING.band_points[band] ?? 0;}
function dimScore(dim){
  const vals=dim.probes.map(p=>pts(answers[p.id]));
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function bandForScore(s){
  const t=SCORING.band_thresholds;
  if(s>=t.institutional_grade) return "institutional_grade";
  if(s>=t.robust) return "robust";
  if(s>=t.developing) return "developing";
  return "foundational";
}
function composite(){
  let wsum=0, tot=0;
  DIMENSIONS.forEach(d=>{
    const w=SCORING.dimension_weights[d.id] ?? 1;
    tot += dimScore(d)*w; wsum += w;
  });
  return wsum? tot/wsum : 0;
}
function dimComplete(dim){return dim.probes.every(p=>answers[p.id]);}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  window.scrollTo({top:0,behavior:"instant"});
  if(stepIndex===0) return renderIntro();
  if(stepIndex>=1 && stepIndex<=7) return renderDimension(DIMENSIONS[stepIndex-1]);
  return renderResult();
}

function renderIntro(){
  app.innerHTML=`
  <div class="hero"><div class="wrap screen">
    <div class="eyebrow on-navy">Investment Governance Diagnostic</div>
    <h1>How does your investment governance measure up?</h1>
    <p class="lede">A structured self-assessment across seven dimensions of investment governance — benchmarked not against your peers, but against institutional-grade practice.</p>
    <div class="facts">
      <div class="fact"><div class="n">7</div><div class="l">dimensions of governance</div></div>
      <div class="fact"><div class="n">~5</div><div class="l">minutes to complete</div></div>
      <div class="fact"><div class="n">1</div><div class="l">standard: institutional-grade</div></div>
    </div>
    <button class="btn btn-on-navy" id="begin">Begin the diagnostic <span class="arrow">&rarr;</span></button>
    <p class="note">For wholesale investors — investment committees, boards, licensees and advisers. Your answers are private until you choose to see your full result.</p>
  </div></div>`;
  document.getElementById("begin").onclick=()=>{stepIndex=1; render();};
}

function renderDimension(dim){
  const pct=Math.round(((stepIndex-1)/7)*100);
  const probesHtml=dim.probes.map(p=>`
    <div class="qblock">
      <div class="qprompt">${p.prompt}</div>
      <div class="options">
        ${BAND_ORDER.map(b=>`
          <div class="opt">
            <input type="radio" id="${p.id}_${b}" name="${p.id}" value="${b}" ${answers[p.id]===b?"checked":""}/>
            <label for="${p.id}_${b}">
              <span class="band-tag">${BAND_LABEL[b]}</span>
              <span class="band-desc">${p.options[b]}</span>
            </label>
          </div>`).join("")}
      </div>
    </div>`).join("");

  app.innerHTML=`
  <div class="wrap">
    <div class="progress">
      <div class="progress-meta">
        <span class="step">Dimension ${dim.n} of 7</span>
        <span class="step">${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="screen">
      <div class="eyebrow">Dimension ${String(dim.n).padStart(2,"0")}</div>
      <h2 class="dim-title">${dim.title}</h2>
      <div class="qblocks">${probesHtml}</div>
      <div class="gate-error" id="dimErr">Please answer every question to continue.</div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="back">&larr; Back</button>
        <button class="btn btn-primary" id="next">${dim.n===7?"See your result":"Continue"} <span class="arrow">&rarr;</span></button>
      </div>
    </div>
  </div>`;

  app.querySelectorAll('input[type=radio]').forEach(r=>{
    r.addEventListener("change",e=>{answers[e.target.name]=e.target.value; document.getElementById("dimErr").style.display="none";});
  });
  document.getElementById("back").onclick=()=>{stepIndex--; render();};
  document.getElementById("next").onclick=()=>{
    if(!dimComplete(dim)){document.getElementById("dimErr").style.display="block"; return;}
    stepIndex++; render();
  };
}

/* ---------- radar (signature element) ---------- */
function buildRadar(){
  const size=300, cx=size/2, cy=size/2+6, R=112, N=7;
  const ang=i=>(-Math.PI/2)+(i*2*Math.PI/N);
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  // rings
  let rings="";
  [0.25,0.5,0.75].forEach(f=>{
    const p=Array.from({length:N},(_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(",")).join(" ");
    rings+=`<polygon points="${p}" fill="none" stroke="#e0d8cb" stroke-width="1"/>`;
  });
  // institutional ring (copper, the bar)
  const outer=Array.from({length:N},(_,i)=>pt(i,R).map(v=>v.toFixed(1)).join(",")).join(" ");
  // spokes + labels
  let spokes="";
  DIMENSIONS.forEach((d,i)=>{
    const [x,y]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e0d8cb" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+16);
    spokes+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="12" font-weight="600" fill="#1A3A52" text-anchor="middle" dominant-baseline="middle">D${d.n}</text>`;
  });
  // data polygon
  const data=DIMENSIONS.map((d,i)=>{const r=R*(dimScore(d)/100); return pt(i,r).map(v=>v.toFixed(1)).join(",");}).join(" ");
  return `<svg width="${size}" height="${size+20}" viewBox="0 0 ${size} ${size+20}" role="img" aria-label="Your governance profile across seven dimensions">
    ${rings}
    <polygon points="${outer}" fill="none" stroke="#B08D57" stroke-width="1.75"/>
    ${spokes}
    <polygon points="${data}" fill="rgba(21,112,107,.18)" stroke="#15706B" stroke-width="2"/>
    ${DIMENSIONS.map((d,i)=>{const r=R*(dimScore(d)/100);const[x,y]=pt(i,r);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#15706B"/>`;}).join("")}
  </svg>`;
}

function renderResult(){
  const comp=composite();
  const band=bandForScore(comp);
  if(resultPhase==="free"){
    app.innerHTML=`
    <div class="wrap"><div class="screen">
      <div class="eyebrow">Your result</div>
      <h2 class="result-band" style="color:${BAND_COLOR[band]}">${BAND_LABEL[band]}</h2>
      <p class="result-line">${HEADLINE[band]}</p>
      <div class="radar-holder">${buildRadar()}</div>
      <div class="radar-legend">
        <span class="k"><span class="swatch" style="background:#B08D57"></span>Institutional-grade standard</span>
        <span class="k"><span class="swatch" style="background:#15706B"></span>Your profile</span>
      </div>
      <div class="gate">
        <h3>See your full breakdown</h3>
        <p class="gate-sub">Your result across all seven dimensions, with what institutional-grade looks like on each and where your biggest gaps are. Enter your work email to unlock it.</p>
        <div class="grid2">
          <div class="field"><label for="f_name">Name</label><input id="f_name" autocomplete="name"/></div>
          <div class="field"><label for="f_email">Work email</label><input id="f_email" type="email" autocomplete="email"/></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="f_org">Organisation</label><input id="f_org" autocomplete="organization"/></div>
          <div class="field"><label for="f_role">Role</label><input id="f_role" autocomplete="organization-title"/></div>
        </div>
        <div class="field"><label for="f_type">Organisation type</label>
          <select id="f_type">${ORG_TYPES.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select>
        </div>
        <label class="consent"><input type="checkbox" id="f_consent"/>
          <span>I agree that Delta Investment Partners may use these details to send my result and contact me about it, and may use my responses in de-identified, aggregated form to benchmark investment governance across the industry.</span></label>
        ${CONFIG.TURNSTILE_SITE_KEY?`<div class="cf-turnstile" data-sitekey="${CONFIG.TURNSTILE_SITE_KEY}"></div>`:""}
        <div class="gate-error" id="gateErr"></div>
        <button class="btn btn-primary" id="unlock">Unlock my full result <span class="arrow">&rarr;</span></button>
      </div>
      <div class="nav-row"><button class="btn btn-ghost" id="back">&larr; Back</button><span></span></div>
    </div></div>`;
    document.getElementById("back").onclick=()=>{stepIndex=7; render();};
    document.getElementById("unlock").onclick=submitGate;
  } else {
    // detail
    const ranked=[...DIMENSIONS].sort((a,b)=>dimScore(a)-dimScore(b));
    const gaps=ranked.slice(0,3).filter(d=>bandForScore(dimScore(d))!=="institutional_grade");
    const dimRows=DIMENSIONS.map(d=>{
      const b=bandForScore(dimScore(d));
      return `<div class="dimrow">
        <div class="dname">D${d.n} · ${d.title}</div>
        <span class="chip" style="background:${BAND_COLOR[b]}">${BAND_LABEL[b]}</span>
        <div class="dguide">${GUIDE[d.id]}</div>
      </div>`;
    }).join("");
    const gapList = gaps.length? `
      <div class="priority">
        <h3>Where the distance to institutional-grade is greatest</h3>
        <p class="pl">Not a verdict — these are where focused attention will move your governance forward fastest.</p>
        <ul>${gaps.map(d=>`<li><span>D${d.n} · ${d.title}</span><span class="chip" style="background:${BAND_COLOR[bandForScore(dimScore(d))]}">${BAND_LABEL[bandForScore(dimScore(d))]}</span></li>`).join("")}</ul>
      </div>`:"";
    app.innerHTML=`
    <div class="wrap"><div class="screen">
      <div class="eyebrow">Your full result</div>
      <h2 class="result-band" style="color:${BAND_COLOR[band]}">${BAND_LABEL[band]}</h2>
      <p class="detail-intro">${INTERPRET[band]}</p>
      ${dimRows}
      ${gapList}
      <p class="helps"><strong>How Delta helps.</strong> Delta works with investment teams and boards to close exactly these gaps — from establishing beliefs and governance frameworks to building independent challenge and peer review into how decisions are made. Institutional rigour, without an institutional-scale team.</p>
      <div class="cta">
        <div class="eyebrow">Want us to pressure-test this properly?</div>
        <h3>Turn a self-assessment into an independent view.</h3>
        <p>A short conversation with Delta shows where your governance genuinely stands, and the two or three changes that would matter most.</p>
        <a class="btn btn-on-navy" href="${CONFIG.START_CONVERSATION_URL}">Start a conversation <span class="arrow">&rarr;</span></a>
      </div>
    </div></div>`;
  }
}

/* =====================================================================
   SUBMIT
   ===================================================================== */
async function submitGate(){
  const err=document.getElementById("gateErr");
  const val=id=>document.getElementById(id).value.trim();
  const name=val("f_name"), email=val("f_email"), org=val("f_org"),
        role=val("f_role"), type=document.getElementById("f_type").value,
        consent=document.getElementById("f_consent").checked;
  err.style.display="none";
  const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!name||!emailOk||!org){err.textContent="Please enter your name, a valid work email, and your organisation."; err.style.display="block"; return;}
  if(!consent){err.textContent="Please tick the consent box to see your result."; err.style.display="block"; return;}

  const token = (window.turnstile && CONFIG.TURNSTILE_SITE_KEY) ? (window.turnstile.getResponse()||"") : "";
  if(CONFIG.TURNSTILE_SITE_KEY && !token){err.textContent="Please complete the verification check."; err.style.display="block"; return;}

  const btn=document.getElementById("unlock");
  btn.disabled=true; btn.textContent="Preparing your result…";

  const payload={
    contact:{name,email,organisation:org,role,org_type:type,consent},
    answers, token,
    client_composite:Math.round(composite()*100)/100
  };
  // Best-effort store; the page still renders the result if the function isn't wired yet.
  try{
    if(CONFIG.TURNSTILE_SITE_KEY){
      await fetch(CONFIG.SUBMIT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    }
  }catch(e){/* preview mode / offline: proceed to show result */}

  resultPhase="detail"; render();
}

/* Optionally sync live scoring weights so the on-screen score matches the back end. */
(async function initConfig(){
  try{
    const r=await fetch(CONFIG.CONFIG_URL,{method:"GET"});
    if(r.ok){const c=await r.json(); if(c&&c.dimension_weights) SCORING={...SCORING,...c};}
  }catch(e){/* use defaults */}
  render();
})();
</script>
